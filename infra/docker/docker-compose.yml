name: card-servicing-agent

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-card}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-card}
      POSTGRES_DB: ${POSTGRES_DB:-card_servicing}
    ports:
      # Host port is configurable to avoid clashes with other local Postgres
      # containers/services; container-internal port stays 5432.
      - "${POSTGRES_HOST_PORT:-5433}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-card} -d ${POSTGRES_DB:-card_servicing}"]
      interval: 5s
      timeout: 5s
      retries: 10

  mongo:
    image: mongo:7
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-card}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:-card}
    ports:
      - "27017:27017"
    volumes:
      - mongodata:/data/db

  api:
    build:
      context: ../..
      dockerfile: infra/docker/api.Dockerfile
    environment:
      NODE_ENV: development
      PORT: "4000"
      DATABASE_URL: postgres://${POSTGRES_USER:-card}:${POSTGRES_PASSWORD:-card}@postgres:5432/${POSTGRES_DB:-card_servicing}
      MONGO_URL: mongodb://${MONGO_USER:-card}:${MONGO_PASSWORD:-card}@mongo:27017
      # Shared with the agent so it can validate the same access tokens.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
      mongo:
        condition: service_started

  # ── MCP tool servers (true MCP protocol, streamable HTTP) ──────────
  # One image, three commands. Each fronts the Node API scoped by the
  # customer's bearer token forwarded from the agent.
  mcp-accounts:
    build:
      context: ../..
      dockerfile: infra/docker/mcp.Dockerfile
    command: ["python", "accounts_server.py"]
    environment:
      PORT: "9101"
      API_BASE_URL: http://api:4000
    depends_on:
      - api

  mcp-transactions:
    build:
      context: ../..
      dockerfile: infra/docker/mcp.Dockerfile
    command: ["python", "transactions_server.py"]
    environment:
      PORT: "9102"
      API_BASE_URL: http://api:4000
    depends_on:
      - api

  mcp-servicing:
    build:
      context: ../..
      dockerfile: infra/docker/mcp.Dockerfile
    command: ["python", "servicing_server.py"]
    environment:
      PORT: "9103"
      API_BASE_URL: http://api:4000
    depends_on:
      - api

  agent:
    build:
      context: ../..
      dockerfile: infra/docker/agent.Dockerfile
    environment:
      APP_ENV: development
      AGENT_PORT: "8000"
      # Single LLM provider: OpenRouter (chat + STT + TTS). Required — no fallback.
      # NOTE: compose reads .env relative to THIS file's directory, so pass the
      # repo-root env explicitly: docker compose --env-file .env -f infra/docker/...
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      OPENROUTER_MODEL: ${OPENROUTER_MODEL:-openai/gpt-4o-mini}
      OPENROUTER_STT_MODEL: ${OPENROUTER_STT_MODEL:-openai/whisper-1}
      OPENROUTER_TTS_MODEL: ${OPENROUTER_TTS_MODEL:-openai/gpt-4o-mini-tts}
      OPENROUTER_TTS_VOICE: ${OPENROUTER_TTS_VOICE:-alloy}
      # Shared secret to validate the API's access tokens.
      JWT_SECRET: ${JWT_SECRET:-dev-secret-change-me}
      # Staff key gating the auditor console API.
      AUDITOR_KEY: ${AUDITOR_KEY:-audit-dev-key}
      # Durable sessions + inter-agent shared state.
      MONGO_URL: mongodb://${MONGO_USER:-card}:${MONGO_PASSWORD:-card}@mongo:27017
      MONGO_DB: card_servicing_agent
      # Downstream services.
      API_BASE_URL: http://api:4000
      MCP_ACCOUNTS_URL: http://mcp-accounts:9101/mcp
      MCP_TRANSACTIONS_URL: http://mcp-transactions:9102/mcp
      MCP_SERVICING_URL: http://mcp-servicing:9103/mcp
    ports:
      - "8000:8000"
    depends_on:
      - api
      - mongo
      - mcp-accounts
      - mcp-transactions
      - mcp-servicing

volumes:
  pgdata:
  mongodata:
