[project]
name = "card-servicing-agent"
version = "0.0.0"
description = "Conversational card-servicing AI agent (FastAPI + LangGraph). LLM converses, policy decides."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.9",
  "python-multipart>=0.0.9",  # voice upload (multipart)
  "httpx>=0.28",              # policy-context calls to the Node API
  # OpenRouter is OpenAI-compatible — one SDK for chat, STT, and TTS.
  "openai>=1.50",
  # Multi-agent tool layer + durable sessions + shared-secret auth.
  # Pinned to the 1.x line (stable FastMCP API); 2.0 reworked the module layout.
  "mcp>=1.9,<2",
  "pymongo>=4.9",
  "pyjwt>=2.9",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3",
  "httpx>=0.28",
  "ruff>=0.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
